<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Η σελίδα δεν βρέθηκε – Home Balance</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#22382D">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; upgrade-insecure-requests">
<style>
  @font-face{font-family:'Literata';font-style:normal;font-weight:200 900;font-display:swap;
    src:url(literata-greek.woff2) format('woff2-variations');
    unicode-range:U+0370-0377,U+037A-037F,U+0384-038A,U+038C,U+038E-03A1,U+03A3-03FF;}
  @font-face{font-family:'Literata';font-style:normal;font-weight:200 900;font-display:swap;
    src:url(literata-latin.woff2) format('woff2-variations');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122;}
  @font-face{font-family:'Manrope';font-style:normal;font-weight:200 800;font-display:swap;
    src:url(manrope-greek.woff2) format('woff2-variations');
    unicode-range:U+0370-0377,U+037A-037F,U+0384-038A,U+038C,U+038E-03A1,U+03A3-03FF;}
  @font-face{font-family:'Manrope';font-style:normal;font-weight:200 800;font-display:swap;
    src:url(manrope-latin.woff2) format('woff2-variations');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122;}
  :root{--green:#2F4A3C;--green-deep:#22382D;--cream:#F4F1E9;--paper:#FBFAF6;--ink:#1E2620;--muted:#6E7670;--line:rgba(47,74,60,.14);--gold:#B8935A;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.65;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:48px 40px;max-width:520px;width:100%;box-shadow:0 24px 60px -32px rgba(34,56,45,.4);text-align:left;}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:30px;}
  .brand img{width:34px;height:33px;object-fit:contain;}
  .brand span{font-family:'Literata',Georgia,serif;font-size:18px;font-weight:500;color:var(--green);}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}
  h1{font-family:'Literata',Georgia,serif;font-size:30px;font-weight:500;color:var(--green);letter-spacing:-.02em;line-height:1.15;margin:10px 0 14px;}
  p{font-size:15px;color:var(--muted);margin-bottom:10px;}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;}
  .btn{display:inline-block;background:var(--green);color:var(--cream);border-radius:100px;padding:12px 26px;font-size:14px;font-weight:600;text-decoration:none;}
  .btn:hover{background:var(--green-deep);}
  .btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line);}
  .btn.ghost:hover{background:var(--green);color:var(--cream);}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><img src="/logo.png" alt=""><span>Home Balance</span></div>
  <span class="eyebrow">Σφάλμα 404</span>
  <h1>Αυτή η σελίδα δεν υπάρχει.</h1>
  <p>Μάλλον ο σύνδεσμος άλλαξε ή έχει γραφτεί λάθος. Δεν χάθηκε τίποτε άλλο.</p>
  <p>Από την αρχική μπορείς να πάρεις το δωρεάν template και τον οδηγό μεθόδου.</p>
  <div class="actions">
    <a class="btn" href="/">Πάμε στην αρχική</a>
    <a class="btn ghost" href="mailto:info@homebalance.gr">Γράψε μου</a>
  </div>
</div>
</body>
</html>
